name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  terraform:
    name: test
    runs-on: ubuntu-latest


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Smoke Test
        run: |
          sleep 5
          curl -f http://localhost:8080/ | grep "Application Deployed via Terraform IaC!"

