
name: Simple CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository
        run: |
          echo "Repository cloned successfully!"

      - name: Test README
        run: |
          test -f README.md
          echo "README exists. Test passed!"
